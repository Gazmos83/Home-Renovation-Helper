# Local Postgres only. The backend and frontend run on the host (CLAUDE.md §2).
# pgvector/pgvector:pg17 is the official pgvector build on Postgres 17, so the
# `vector` extension the first migration enables is already present.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: home_renovation_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: home_renovation
    ports:
      # Loopback only — never expose the dev database on a routable interface.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_renovation"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
