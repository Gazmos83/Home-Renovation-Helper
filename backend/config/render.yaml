# Render tiers (CLAUDE.md §6). Exactly draft and final (two-tier-renders removed
# preview); each fixes a frame count, a square resolution and an engine. A render
# request names a tier and nothing else — raw frame counts, resolutions and
# engines are refused.
#
# `timeout_multiplier` scales BLENDER_TIMEOUT_SECONDS for the tier (assumption,
# TODO(user): a final on this CPU can take hours; 24x = 4 h at the 600 s default).
tiers:
  draft:
    frames: 12
    resolution: 800
    engine: eevee
    timeout_multiplier: 1
  final:
    frames: 36
    resolution: 1500
    engine: cycles
    timeout_multiplier: 24
