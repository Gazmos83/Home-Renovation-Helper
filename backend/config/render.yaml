# Render tiers (CLAUDE.md §6). Exactly draft and final (two-tier-renders removed
# preview); each fixes a frame count, a square resolution and an engine. A render
# request names a tier and nothing else — raw frame counts, resolutions and
# engines are refused.
#
# `timeout_multiplier` scales BLENDER_TIMEOUT_SECONDS for the tier. A final may run
# 6 hours (36x the 600 s default), long enough for a detail turntable on this CPU
# (owner's decision 2026-10-15, local-detail-turntable).
tiers:
  draft:
    frames: 12
    resolution: 800
    engine: eevee
    timeout_multiplier: 1
  final:
    frames: 36
    resolution: 1500
    engine: cycles
    timeout_multiplier: 36
