[project]
name = "home-renovation-agents-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pypdf>=5.0.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.54.0",
    "cryptography>=3.1",
    "ragas==0.4.3",
    "langchain-community>=0.3.31,<0.4",
]

# CPU-only PyTorch. This machine has no GPU, and the default PyPI torch wheel
# pulls the CUDA stack. `explicit = true` means only the packages named in
# [tool.uv.sources] come from this index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
markers = [
    "live: runs the real OpenRouter gateway (spends money); needs --live",
    "benchmark: replays a core owner sentence through the real routed models (spends money); needs --benchmark",
    "blender: invokes the pinned Blender 5.2.1 LTS binary; needs --blender",
    "slow: loads the real embedding model (minutes on a cold cache); deselect with -m \"not slow\"",
]
