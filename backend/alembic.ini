# A generic, single database configuration.

[alembic]
# path to migration scripts, relative to the token %(here)s (this ini file).
script_location = %(here)s/app/db/alembic

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

path_separator = os

# database URL. Consumed by app/db/alembic/env.py only (ALEMBIC_DATABASE_URL,
# then DATABASE_URL, then the repo-root .env), so it is not set here.
# sqlalchemy.url =


[post_write_hooks]


# Logging configuration, consumed by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
